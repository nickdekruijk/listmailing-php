name: tests

on:
  push:
    branches: [master, main]
  pull_request:

# Nothing here writes to the repository: reading the code is all a test run needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['^12.0', '^13.0']
        # Pest 5 needs PHP 8.4 and Laravel 13, so the matrix runs Pest 4 and 5.
        stability: ['prefer-lowest', 'prefer-stable']

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring
          coverage: none

      # Laravel goes in require-dev: the package itself never requires it.
      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest

  pint:
    runs-on: ubuntu-latest
    name: pint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      # A library has no lock file in the repository, so this checks the
      # versions a fresh install gets today.
      - name: Check dependencies for known vulnerabilities
        run: composer audit

      - name: Check code style
        run: vendor/bin/pint --test

  types:
    runs-on: ubuntu-latest
    name: types (PHP 8.5 - Laravel 13)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run Larastan
        run: composer types:check
